name: ${PROJECT_NAME}
services: 
    mongodb:
        image: mongo
        restart: always
        container_name: ${PROJECT_NAME}-mongodb
        ports:
            - 27017:27017
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
        volumes:
            - mongodb-data:/data/db
      
    seaweedfs:
        image: chrislusf/seaweedfs:latest
        restart: always
        container_name: ${PROJECT_NAME}-seaweedfs
        environment:
            AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
            AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
        command: >
            server
            -s3
            -s3.port=8333
            -dir=/data
            -volume.max=30
        ports:
            - "8333:8333"   # S3 API
            - "9333:9333"   # Master UI/API
            - "8080:8080"   # Volume server
            - "8888:8888"   # Filer UI/API
        volumes:
            - seaweed-data:/data

volumes:
    mongodb-data:
    seaweed-data:
